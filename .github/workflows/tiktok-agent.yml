# KEJA HALISI — TikTok Ingest Agent (scheduled)
#
# Runs the full autonomous pipeline hourly from GitHub's runner IPs (which are
# NOT behind the Cloudflare walls that block sandbox/datacenter IPs):
#   discover (web-search battery + agent-seeds.txt) → resolve (tikwm) →
#   verify (region/estate/price gates) → snapshot (ffmpeg frames) → store
#
# ONE-TIME SETUP (repo Settings → Secrets and variables → Actions):
#   DATABASE_URL  = Neon POOLED connection string (with ?sslmode=require)
#   DIRECT_URL    = Neon DIRECT connection string
# The workflow generates the Postgres Prisma client, then runs the agent LIVE.

name: tiktok-agent

# SCHEDULE PAUSED 2026-10-25 (issue #1): every hourly run failed because the
# DATABASE_URL/DIRECT_URL secrets were never provisioned. Restore the cron line
# below ONLY after the secrets exist, per the issue's owner-action steps.
on:
  # schedule:
  #   - cron: "23 * * * *" # hourly at :23 - off the busy top-of-hour
  workflow_dispatch: {} # manual trigger button in the Actions tab

concurrency:
  group: tiktok-agent
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Fail fast when required secrets are missing (issue #1)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is empty/unset. This agent writes to the live Neon database; refusing to start. See issue #1 for the owner-action setup steps."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Postgres Prisma client
        run: bunx prisma generate --schema prisma/schema.postgres.prisma
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run ingest agent (live)
        run: |
          bun run scripts/agent-tiktok/index.ts --live --limit 8
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Summary
        if: always()
        run: echo "TikTok agent round complete — see logs above for the run summary."
